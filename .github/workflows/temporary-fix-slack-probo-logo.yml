name: Temporary replace remaining Slack Probo mark

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-fix-slack-probo-logo.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace remaining Probo branding with exact ZebraByte icon
        shell: bash
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          png_b64 = """"""
          path = Path('public/lottie/trust-center/slack.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for asset in data.get('assets', []):
              if asset.get('id') == 'zebrabyte-slack-brand-local':
                  asset['w'] = 290
                  asset['h'] = 85
                  asset['e'] = 1
                  asset['p'] = 'data:image/png;base64,' + png_b64
                  break
          else:
              raise SystemExit('zebrabyte-slack-brand-local asset not found')
          path.write_text(json.dumps(data, separators=(',', ':')), encoding='utf-8')
          PY2
      - name: Commit fixed animation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-fix-slack-probo-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lottie/trust-center/slack.json .github/workflows/temporary-fix-slack-probo-logo.yml
          git commit -m "fix: replace remaining Probo mark with exact ZebraByte icon"
          git push origin HEAD:main
