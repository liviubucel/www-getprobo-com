name: Visual polish bootstrap v2
on:
  push:
    branches: [fix/probo-visual-polish]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/probo-visual-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if new in s: return
              if old not in s: raise SystemExit(f"missing snippet: {path}")
              p.write_text(s.replace(old,new,1))
          r('public/og-zebrabyte.svg','<title id="title">ZebraByte — Cyber Security & Compliance</title>','<title id="title">ZebraByte — Cyber Security &amp; Compliance</title>')
          r('src/components/HeaderMenu.astro','''  .navigation-feature-halo {\n    position: absolute;\n    inset: 18% -20% -38%;\n    display: block;\n    border-radius: 50%;\n    background: radial-gradient(circle at 50% 45%, rgba(147, 201, 38, 0.2), transparent 62%);\n    pointer-events: none;\n  }''','''  .navigation-feature-halo {\n    position: absolute;\n    bottom: -52px;\n    left: 50%;\n    z-index: 2;\n    display: block;\n    width: 783px;\n    height: 783px;\n    transform: translateX(-50%);\n    pointer-events: none;\n  }\n\n  .navigation-feature-halo::before {\n    position: absolute;\n    inset: -21.93%;\n    content: \"\";\n    background: url(\"/navigation/ellipse.svg\") center / 100% 100% no-repeat;\n    transform: rotate(180deg) scaleY(-1);\n  }''')
          r('src/components/Header.astro','"bg-secondary/90 sticky top-0 z-50 border-b backdrop-blur-md"','"bg-secondary/80 sticky top-0 z-50 border-b backdrop-blur-md"')
          r('src/components/AccountMenu.astro','"text-primary grid size-10 place-items-center transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",','"text-primary grid place-items-center transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",')
          r('src/components/AccountMenu.astro','? "text-muted-foreground hover:text-primary rounded-lg hover:bg-subtle aria-expanded:bg-subtle aria-expanded:text-primary aria-expanded:ring-1 aria-expanded:ring-current/10"\n        : "bg-secondary hover:bg-active rounded-full border shadow-[0_1px_2px_rgba(20,30,18,0.04)] transition-[background-color,border-color,box-shadow] hover:shadow-[0_3px_10px_rgba(20,30,18,0.09)] aria-expanded:bg-subtle aria-expanded:shadow-[0_3px_10px_rgba(20,30,18,0.10)]",','? "text-muted-foreground hover:text-primary size-10 rounded-lg hover:bg-subtle aria-expanded:bg-subtle aria-expanded:text-primary aria-expanded:ring-1 aria-expanded:ring-current/10"\n        : "bg-secondary hover:bg-active shadow-btn size-8 rounded-full border transition-[background-color,border-color,box-shadow] aria-expanded:bg-subtle",')
          r('src/components/AccountMenu.astro','"bg-secondary overflow-hidden border shadow-[0_16px_32px_rgba(20,30,18,0.16)]",','"bg-secondary overflow-hidden border shadow-[inset_0_0_0_1px_var(--color-border-low),0_16px_32px_rgba(186,193,122,0.2)]",')
          r('src/components/LanguageSwitcher.astro','"text-muted-foreground hover:text-primary inline-flex h-10 items-center justify-center gap-1.5 rounded-lg px-2 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",\n    compact && "px-1.5",','"text-muted-foreground hover:text-primary hover:bg-highlight inline-flex items-center justify-center gap-1.5 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current focus-visible:ring-offset-2",\n    compact ? "size-10 rounded-lg px-1.5" : "h-8 rounded-md px-[9px]",')
          r('package.json','"check:experience": "node tools/check-experience-contract.mjs && node tools/check-experience-provenance.mjs",','"check:experience": "node tools/check-probo-design-contract.mjs && node tools/check-svg-assets.mjs && node tools/check-experience-contract.mjs && node tools/check-experience-provenance.mjs",')
          PY
          cat > tools/check-svg-assets.mjs <<'EOF'
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";
          const roots=["public","src/assets"], bare=/&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g, failures=[];
          async function walk(dir){let es;try{es=await readdir(dir,{withFileTypes:true})}catch(e){if(e?.code==='ENOENT')return;throw e}for(const e of es){const f=path.join(dir,e.name);if(e.isDirectory()){await walk(f);continue}if(!e.isFile()||!e.name.toLowerCase().endsWith('.svg'))continue;const s=await readFile(f,'utf8');if([...s.matchAll(bare)].length)failures.push(`${f}: unescaped XML entity '&'`);if(!/<svg\b/i.test(s)||!/<\/svg>/i.test(s))failures.push(`${f}: missing <svg> root/end tag`)}}
          for(const root of roots)await walk(root);if(failures.length){console.error('SVG asset validation failed:\n'+failures.map(x=>`- ${x}`).join('\n'));process.exit(1)}console.log('SVG assets: sanity checks passed.');
          EOF
          cat > tools/check-probo-design-contract.mjs <<'EOF'
          import { createHash } from "node:crypto";import { readFile } from "node:fs/promises";
          const expected=new Map([["src/styles/theme.css","d514f5f87f0cd7727e007d0f0a51b5c8bd4e2bbb"],["src/styles/global.css","feb11855739bcc75d0dcb378d38907d3b497c3c8"],["src/components/ui/Button.svelte","67b134e8decd903993d95ce78275356146028613"],["public/navigation/ellipse.svg","c5df0e5e37ed217f2d312c632db58196893b8775"],["public/navigation/browser.svg","ed82881e6a49ecb1a88f57e8669c8bfbecc08f2c"]]);
          const sha=b=>createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex');const failures=[];for(const [f,e] of expected){const a=sha(await readFile(f));if(a!==e)failures.push(`${f}: ${a} != ${e}`)}const menu=await readFile('src/components/HeaderMenu.astro','utf8');if(!menu.includes('background: url("/navigation/ellipse.svg") center / 100% 100% no-repeat;'))failures.push('HeaderMenu: Probo halo missing');if(menu.includes('radial-gradient(circle at 50% 45%'))failures.push('HeaderMenu: simplified halo present');if(failures.length){console.error('Probo visual contract failed:\n'+failures.map(x=>`- ${x}`).join('\n'));process.exit(1)}console.log('Probo visual primitives: contract preserved.');
          EOF
          npm ci
          npm run check:experience
          npm run build
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/visual-polish-bootstrap.yml .github/workflows/visual-polish-bootstrap-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "Polish ZebraByte visual system against Probo"
          git push origin HEAD:fix/probo-visual-polish
