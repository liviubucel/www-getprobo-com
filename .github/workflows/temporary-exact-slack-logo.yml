name: Temporary exact Slack logo replacement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-exact-slack-logo.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Replace original Probo logo and wordmark in Slack Lottie
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, urllib.request
          from pathlib import Path
          from io import BytesIO
          from PIL import Image

          path = Path('public/lottie/trust-center/slack.json')
          data = json.loads(path.read_text())
          assets = {str(a.get('id')): a for a in data.get('assets', [])}

          icon_url = 'https://pub-038e8088013241609a22cbfd541724a4.r2.dev/icon%20ZebraByte.png'
          with urllib.request.urlopen(icon_url, timeout=30) as r:
              im = Image.open(BytesIO(r.read())).convert('RGBA')
          bbox = im.getbbox()
          if bbox: im = im.crop(bbox)
          im.thumbnail((53, 53), Image.Resampling.LANCZOS)
          canvas = Image.new('RGBA', (53, 53), (255,255,255,0))
          canvas.alpha_composite(im, ((53-im.width)//2, (53-im.height)//2))
          bio = BytesIO(); canvas.save(bio, format='PNG')
          icon_b64 = base64.b64encode(bio.getvalue()).decode('ascii')

          exact_id = 'zebrabyte-exact-icon-final'
          data['assets'] = [a for a in data.get('assets', []) if a.get('id') not in {'zebrabyte-slack-brand-local', exact_id}]
          data['assets'].append({'id':exact_id,'w':53,'h':53,'u':'','p':'data:image/png;base64,'+icon_b64,'e':1})
          assets = {str(a.get('id')): a for a in data['assets']}

          logo_layers = {'355':353,'861':859,'2494':2492,'3004':3002}
          for aid, ind in logo_layers.items():
              layer = next(l for l in assets[aid]['layers'] if l.get('ind') == ind)
              layer['ty'] = 2; layer['refId'] = exact_id; layer['w'] = 53; layer['h'] = 53
              ks = layer.setdefault('ks', {})
              ks['a'] = {'a':0,'k':[30,30,0]}; ks['p'] = {'a':0,'k':[30,30,0]}
              ks['s'] = {'a':0,'k':[100,100,100]}; ks['r'] = {'a':0,'k':0}; ks['o'] = {'a':0,'k':100}

          for a in data['assets']:
              if 'layers' in a:
                  a['layers'] = [l for l in a['layers'] if l.get('refId') != 'zebrabyte-slack-brand-local']
          data['layers'] = [l for l in data.get('layers', []) if l.get('refId') != 'zebrabyte-slack-brand-local']

          wordmark_groups = {'305':292,'861':804,'2444':2431,'2957':2944}
          for aid, ind in wordmark_groups.items():
              layer = next(l for l in assets[aid]['layers'] if l.get('ind') == ind)
              layer.setdefault('ks', {})['o'] = {'a':0,'k':0}

          path.write_text(json.dumps(data, separators=(',',':')))
          check = json.loads(path.read_text()); ca = {str(a.get('id')):a for a in check['assets']}
          assert 'zebrabyte-slack-brand-local' not in ca and exact_id in ca
          uses=[]
          for a in check['assets']:
              for l in a.get('layers',[]):
                  if l.get('refId') == exact_id: uses.append((str(a.get('id')),l.get('ind')))
                  assert l.get('refId') != 'zebrabyte-slack-brand-local'
          assert sorted(uses)==sorted([('355',353),('861',859),('2494',2492),('3004',3002)]), uses
          for aid,ind in wordmark_groups.items():
              layer=next(l for l in ca[aid]['layers'] if l.get('ind')==ind)
              assert layer.get('ks',{}).get('o',{}).get('k')==0
          print('verified exact icon replacements',uses)
          PY

      - name: Commit exact Lottie fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lottie/trust-center/slack.json
          git diff --cached --quiet && { echo 'No Lottie change'; exit 1; }
          git commit -m 'fix: replace Slack Probo vector with exact ZebraByte icon'
          git push origin HEAD:main
