name: Temporary Slack APP diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-slack-app-diagnostic.yml

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect APP and ZebraByte layers
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('public/lottie/trust-center/slack-zebrabyte-v6.json')
          data = json.loads(src.read_text())
          out=[]

          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  vals=[]
                  for k,v in obj.items():
                      if isinstance(v, (str,int,float,bool)) or v is None:
                          vals.append(f'{k}={v!r}')
                  joined=' '.join(vals)
                  if 'APP' in joined or 'ZEBRABYTE' in joined:
                      out.append(path+' :: '+joined[:1500])
                  for k,v in obj.items():
                      walk(v, f'{path}.{k}')
              elif isinstance(obj, list):
                  for i,v in enumerate(obj):
                      walk(v, f'{path}[{i}]')
          walk(data)

          # Asset/layer summary around likely branding refs.
          for asset in data.get('assets',[]):
              aid=str(asset.get('id'))
              for layer in asset.get('layers',[]) or []:
                  nm=str(layer.get('nm',''))
                  ref=str(layer.get('refId',''))
                  text=''
                  try:
                      ks=layer.get('t',{}).get('d',{}).get('k',[])
                      text='|'.join(str(k.get('s',{}).get('t','')) for k in ks)
                  except Exception:
                      pass
                  if ('APP' in nm or 'APP' in text or 'ZEBRABYTE' in nm or 'ZEBRABYTE' in text or aid in {'305','861','2444','2957'}):
                      out.append(f'ASSET {aid} LAYER ind={layer.get("ind")} nm={nm!r} refId={ref!r} ty={layer.get("ty")} hd={layer.get("hd")} text={text!r}')

          Path('.tmp-slack-app-diagnostic.txt').write_text('\n'.join(out))
          print('\n'.join(out[:100]))
          PY
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/temporary-slack-app-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-slack-app-diagnostic.txt
          git commit -m 'chore: capture Slack APP layer diagnostic'
          git push origin HEAD:main
