name: Restore Compliance Portal logo design

on:
  push:
    branches:
      - fix/restore-logos-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/restore-logos-design

      - name: Restore shared carousel and patch only Compliance Portal
        run: |
          git show 0e53053f1d012f935771eb29baa6046cf0137c27:src/components/LogosScroll.svelte > src/components/LogosScroll.svelte
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/products/compliance-portal.astro')
          s = p.read_text()
          old = '      <LogosScroll logos={trustedLogos} client:visible />'
          new = '''      <LogosScroll class="flex h-16 w-max items-center sm:h-30" client:visible>
        {
          trustedLogos.map((logo) => (
            <div class="mx-4 flex w-30 flex-none items-center justify-center sm:mx-15 sm:w-50">
              <img
                src={logo.src}
                alt={logo.alt}
                class:list={["h-6 w-auto object-contain sm:h-7", logo.class]}
                width={logo.width}
                height={logo.height}
                loading="lazy"
                decoding="async"
              />
            </div>
          ))
        }
      </LogosScroll>'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one LogosScroll logos prop usage, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate build
        run: npm run build

      - name: Commit clean fix
        run: |
          rm .github/workflows/fix-restore-logos-design.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LogosScroll.svelte src/pages/products/compliance-portal.astro .github/workflows/fix-restore-logos-design.yml
          git commit -m "fix: restore original logo carousel design"
          git push origin HEAD:fix/restore-logos-design
