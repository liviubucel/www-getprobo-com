name: Safe SEO and performance hardening

on:
  push:
    branches:
      - safe/seo-performance-no-design

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: safe/seo-performance-no-design

      - name: Apply non-visual technical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/i18n.ts',
              '  const baseUrl = url.origin;\n',
              '  const baseUrl = "https://www.zebrabyte.ro";\n',
          )

          replace_once(
              'astro.config.mjs',
              '        if (pathname === "/blog/page/1") return false;\n',
              '        if (pathname === "/blog/page/1") return false;\n        if (pathname === "/products/compliance-portal") return false;\n',
          )

          robots = Path('public/robots.txt')
          robots_text = robots.read_text()
          robots_text = robots_text.replace('Disallow: /products/compliance-portal\n', '')
          robots_text = robots_text.replace('Host: https://www.zebrabyte.ro', 'Host: www.zebrabyte.ro')
          robots.write_text(robots_text)

          replace_once(
              'src/lib/redirects.mjs',
              '  "/subprocessors": redirect("https://compliance.probo.com/subprocessors"),\n',
              '  "/subprocessors": redirect("https://trust.zebrabyte.ro/subprocessors"),\n',
          )

          replace_once(
              'src/components/Footer.astro',
              '      <a href="/" class="block w-max">\n        <ZebraByteLogo />\n      </a>\n',
              '      <div class="block w-max">\n        <ZebraByteLogo />\n      </div>\n',
          )

          logo = Path('src/components/ZebraByteLogo.astro')
          logo_text = logo.read_text()
          logo_text = logo_text.replace(
              '  inverse?: boolean;\n}\n\nconst { class: className = "", inverse = false } = Astro.props;\n',
              '  inverse?: boolean;\n  priority?: boolean;\n}\n\nconst { class: className = "", inverse = false, priority = false } = Astro.props;\n',
          )
          logo_text = logo_text.replace(
              '    height="1166"\n    class:list={[\n',
              '    height="1166"\n    loading={priority ? "eager" : "lazy"}\n    decoding="async"\n    fetchpriority={priority ? "high" : "auto"}\n    class:list={[\n',
          )
          logo.write_text(logo_text)
          replace_once(
              'src/components/Header.astro',
              '    <ZebraByteLogo class="mr-auto" />\n',
              '    <ZebraByteLogo class="mr-auto" priority />\n',
          )

          main = Path('worker/main.ts')
          main_text = main.read_text()
          marker = '''function reportInBackground(\n  context: ExecutionContextLike | undefined,\n  promise: Promise<unknown>,\n): void {'''
          helper = '''function withDeploymentSeoHeaders(request: Request, response: Response): Response {\n  const hostname = new URL(request.url).hostname.toLowerCase();\n  if (hostname !== "stag.zebrabyte.ro") return response;\n\n  const headers = new Headers(response.headers);\n  headers.set("X-Robots-Tag", "noindex, nofollow, noarchive");\n  return new Response(response.body, {\n    status: response.status,\n    statusText: response.statusText,\n    headers,\n  });\n}\n\n'''
          if main_text.count(marker) != 1:
              raise SystemExit('worker/main.ts: report marker not unique')
          main_text = main_text.replace(marker, helper + marker, 1)
          old_return = '''      return response;\n    } catch (error) {'''
          new_return = '''      return withDeploymentSeoHeaders(request, response);\n    } catch (error) {'''
          if main_text.count(old_return) != 1:
              raise SystemExit('worker/main.ts: final router return not unique')
          main.write_text(main_text.replace(old_return, new_return, 1))

          router = Path('worker/router.ts')
          router_text = router.read_text()
          insertion_point = '''    const requestEnv = apiLocale ? withLocalizedEmailEnv(env, apiLocale) : env;\n\n    if (!english) {'''
          static_llms = '''    const requestEnv = apiLocale ? withLocalizedEmailEnv(env, apiLocale) : env;\n\n    if (isLocalizablePublicTextPath(url.pathname)) {\n      const upstreamUrl = new URL(request.url);\n      upstreamUrl.pathname = stripEnglishPrefix(url.pathname);\n      const upstreamRequest = new Request(upstreamUrl, request);\n      const response = await app.fetch(upstreamRequest, requestEnv);\n      const headers = new Headers(response.headers);\n      headers.set("Content-Language", "en");\n      headers.set(\n        "Cache-Control",\n        "public, max-age=3600, s-maxage=86400, stale-while-revalidate=604800",\n      );\n      headers.set("X-Content-Type-Options", "nosniff");\n      return new Response(response.body, {\n        status: response.status,\n        statusText: response.statusText,\n        headers,\n      });\n    }\n\n    if (!english) {'''
          if router_text.count(insertion_point) != 1:
              raise SystemExit('worker/router.ts: insertion point not unique')
          router.write_text(router_text.replace(insertion_point, static_llms, 1))
          PY

      - name: Assert design freeze
        run: |
          git diff --exit-code HEAD -- src/pages/products/compliance-portal.astro src/pages/compliance-portal.astro src/styles || {
            echo 'ERROR: design-protected files changed';
            exit 1;
          }
          python - <<'PY'
          import subprocess
          allowed = {
            'astro.config.mjs',
            'public/robots.txt',
            'src/lib/i18n.ts',
            'src/lib/redirects.mjs',
            'src/components/Footer.astro',
            'src/components/Header.astro',
            'src/components/ZebraByteLogo.astro',
            'worker/main.ts',
            'worker/router.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'Unexpected changed files: {sorted(extra)}')
          if not changed:
              raise SystemExit('No technical changes produced')
          print('Allowed files only:', sorted(changed))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Experience checks
        run: npm run check:experience

      - name: Production build
        run: npm run build

      - name: Validate targeted invariants
        run: |
          grep -q 'const baseUrl = "https://www.zebrabyte.ro"' src/lib/i18n.ts
          ! grep -q 'Disallow: /products/compliance-portal' public/robots.txt
          grep -q 'Host: www.zebrabyte.ro' public/robots.txt
          grep -q 'pathname === "/products/compliance-portal"' astro.config.mjs
          grep -q 'https://trust.zebrabyte.ro/subprocessors' src/lib/redirects.mjs
          grep -q 'X-Robots-Tag' worker/main.ts
          grep -q 'stale-while-revalidate=604800' worker/router.ts
          grep -q 'priority />' src/components/Header.astro
          ! grep -q '<a href="/" class="block w-max">' src/components/Footer.astro

      - name: Commit validated patch
        run: |
          rm .github/workflows/safe-seo-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro.config.mjs public/robots.txt src/lib/i18n.ts src/lib/redirects.mjs src/components/Footer.astro src/components/Header.astro src/components/ZebraByteLogo.astro worker/main.ts worker/router.ts .github/workflows/safe-seo-performance.yml
          git commit -m "fix: harden technical SEO and performance without design changes"
          git push origin HEAD:safe/seo-performance-no-design
