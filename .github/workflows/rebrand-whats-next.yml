name: Rebrand Whats Next communication kits

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/rebrand-whats-next.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace upstream public identity while preserving page layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('src/pages/whats-next/ISO27001.astro'),
              Path('src/pages/whats-next/soc2.astro'),
          ]
          for path in files:
              text = path.read_text()
              # Use the real ZebraByte mark for all previous upstream logo variants.
              text = text.replace('import ProboLogoOnly from "../../assets/probo-logo-only.svg";', 'import ZebraByteLogoOnly from "../../assets/zebrabyte-mark.svg";')
              text = text.replace('import ProboLogo from "../../assets/probo-logo.svg";', 'import ZebraByteLogo from "../../assets/zebrabyte-mark.svg";')
              text = text.replace('import ProboWhiteLogo from "../../assets/probo_white_logo.svg";', 'import ZebraByteWhiteLogo from "../../assets/zebrabyte-mark.svg";')
              text = text.replace('ProboLogoOnly', 'ZebraByteLogoOnly')
              text = text.replace('ProboLogo', 'ZebraByteLogo')
              text = text.replace('ProboWhiteLogo', 'ZebraByteWhiteLogo')

              # Current ZebraByte trust center and preserved local article paths.
              text = text.replace('https://compliance.probo.com/overview', 'https://trust.zebrabyte.ro/')
              text = text.replace('https://www.getprobo.com', 'https://www.zebrabyte.ro')
              text = text.replace('https://getprobo.com', 'https://www.zebrabyte.ro')
              text = text.replace('https://www.probo.com', 'https://www.zebrabyte.ro')
              text = text.replace('https://probo.com', 'https://www.zebrabyte.ro')

              # Public download assets and labels/IDs.
              text = text.replace('href="/probo-logo.svg"', 'href="/images/zbt-negru.svg"')
              text = text.replace('href="/probo-logo-only.svg"', 'href="/favicon.svg"')
              text = text.replace('#probo-logo', '#zebrabyte-logo')
              text = text.replace('id="probo-logo"', 'id="zebrabyte-logo"')
              text = text.replace('PROBO', 'ZEBRABYTE')
              text = text.replace('Probo', 'ZebraByte')
              text = text.replace('probo logo', 'ZebraByte logo')
              path.write_text(text)
          PY
      - name: Verify communication kits have no visible upstream identity
        run: |
          if grep -nEi 'Probo|GetProbo|probo\.com|getprobo\.com|probo-logo|probo_white_logo' src/pages/whats-next/ISO27001.astro src/pages/whats-next/soc2.astro; then
            echo 'Upstream identity remains in Whats Next source.' >&2
            exit 1
          fi
      - name: Commit rebranded sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/whats-next/ISO27001.astro src/pages/whats-next/soc2.astro
          git diff --cached --quiet && exit 1
          git commit -m "fix: rebrand compliance communication kits for ZebraByte"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
