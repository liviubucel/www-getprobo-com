name: Vendor partner assets locally

on:
  push:
    branches:
      - feat/legal-center-audit
    paths:
      - .github/workflows/vendor-partner-assets.yml

permissions:
  contents: write

jobs:
  vendor-assets:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legal-center-audit
          fetch-depth: 0

      - name: Download official/local-source partner assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/logos/partners public/logos/compliance
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/uploads/2021/03/20i_logo.svg' \
            --output public/logos/partners/20i.svg

          if ! curl --fail --location --retry 2 --retry-all-errors --user-agent "$UA" \
            --referer 'https://www.xcitium.com/' \
            'https://www.xcitium.com/images/Xcitium-Logo.svg' \
            --output public/logos/partners/xcitium.svg; then
            curl --fail --location --retry 2 --retry-all-errors --user-agent "$UA" \
              --referer 'https://www.xcitium.com/' \
              'https://www.xcitium.com/assets/images/logo/logo-xcitium.svg' \
              --output public/logos/partners/xcitium.svg
          fi

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            --referer 'https://www.iubenda.com/en/help/142513-partner-kit/' \
            'https://www.iubenda.com/wp-content/uploads/2026/04/Bronze.png.webp' \
            --output public/logos/partners/iubenda-certified-partner.webp

          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/liviubucel/Zebrabyte-Web/main/public/logos/compliance/telekom-business-partner.png' \
            --output public/logos/partners/telekom-business-partner.png

          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/liviubucel/Zebrabyte-Web/main/public/logos/compliance/iso-27001.svg' \
            --output public/logos/compliance/iso-27001.svg

          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/liviubucel/Zebrabyte-Web/main/public/logos/compliance/isae3000-type2.svg' \
            --output public/logos/compliance/isae3000-type2.svg

          curl --fail --location --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/liviubucel/Zebrabyte-Web/main/public/logos/compliance/cyber-essentials-plus.svg' \
            --output public/logos/compliance/cyber-essentials-plus.svg

          test -s public/logos/partners/20i.svg
          test -s public/logos/partners/xcitium.svg
          test -s public/logos/partners/iubenda-certified-partner.webp
          test -s public/logos/partners/telekom-business-partner.png
          test -s public/logos/compliance/iso-27001.svg
          test -s public/logos/compliance/isae3000-type2.svg
          test -s public/logos/compliance/cyber-essentials-plus.svg

          grep -qi '<svg' public/logos/partners/20i.svg
          grep -qi '<svg' public/logos/partners/xcitium.svg
          grep -qi '<svg' public/logos/compliance/iso-27001.svg
          grep -qi '<svg' public/logos/compliance/isae3000-type2.svg
          grep -qi '<svg' public/logos/compliance/cyber-essentials-plus.svg

      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/logos/partners public/logos/compliance
          if git diff --cached --quiet; then
            echo 'Assets already current.'
            exit 0
          fi
          git commit -m 'Security: vendor official partner assets [vendor-assets]'
          git push origin HEAD:feat/legal-center-audit
