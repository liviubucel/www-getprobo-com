name: Vendor security assets locally

on:
  push:
    branches:
      - release/production-readiness
    paths:
      - .github/workflows/vendor-partner-assets.yml

permissions:
  contents: write

jobs:
  vendor-assets:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-readiness
          fetch-depth: 0

      - name: Download vendor-controlled security assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/logos/partners public/logos/compliance
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/uploads/2021/03/20i_logo.svg' \
            --output public/logos/partners/20i.svg

          if ! curl --fail --location --retry 2 --retry-all-errors --user-agent "$UA" \
            --referer 'https://www.xcitium.com/' \
            'https://www.xcitium.com/images/Xcitium-Logo.svg' \
            --output public/logos/partners/xcitium.svg; then
            curl --fail --location --retry 2 --retry-all-errors --user-agent "$UA" \
              --referer 'https://www.xcitium.com/' \
              'https://www.xcitium.com/assets/images/logo/logo-xcitium.svg' \
              --output public/logos/partners/xcitium.svg
          fi

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/uploads/2025/05/ISO-9001.svg' \
            --output public/logos/compliance/iso-9001.svg

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/uploads/2025/05/ISO-22301.svg' \
            --output public/logos/compliance/iso-22301.svg

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/uploads/2025/05/ISO-27001.svg' \
            --output public/logos/compliance/iso-27001.svg

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/smush-webp/2025/05/cyberEssentials_PLUS-300x142.png.webp' \
            --output public/logos/compliance/cyber-essentials-plus.webp

          curl --fail --location --retry 4 --retry-all-errors --user-agent "$UA" \
            'https://www.20i.com/blog/wp-content/smush-webp/2025/05/soc2-logo-300x300.png.webp' \
            --output public/logos/compliance/soc2-type2.webp

          test -s public/logos/partners/20i.svg
          test -s public/logos/partners/xcitium.svg
          test -s public/logos/compliance/iso-9001.svg
          test -s public/logos/compliance/iso-22301.svg
          test -s public/logos/compliance/iso-27001.svg
          test -s public/logos/compliance/cyber-essentials-plus.webp
          test -s public/logos/compliance/soc2-type2.webp

          grep -qi '<svg' public/logos/partners/20i.svg
          grep -qi '<svg' public/logos/partners/xcitium.svg
          grep -qi '<svg' public/logos/compliance/iso-9001.svg
          grep -qi '<svg' public/logos/compliance/iso-22301.svg
          grep -qi '<svg' public/logos/compliance/iso-27001.svg

      - name: Commit vendored assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/logos/partners/20i.svg \
            public/logos/partners/xcitium.svg \
            public/logos/compliance/iso-9001.svg \
            public/logos/compliance/iso-22301.svg \
            public/logos/compliance/iso-27001.svg \
            public/logos/compliance/cyber-essentials-plus.webp \
            public/logos/compliance/soc2-type2.webp
          if git diff --cached --quiet; then
            echo 'Assets already current.'
            exit 0
          fi
          git commit -m 'Security: vendor official security assets [vendor-assets]'
          git push origin HEAD:release/production-readiness
