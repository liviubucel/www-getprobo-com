name: Temporary final Slack brand v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-final-slack-brand-v4.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Remove vector Probo and add clean ZEBRABYTE wordmark
        shell: bash
        run: |
          python - <<'PY'
          import base64, json
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          src = Path('public/lottie/trust-center/slack-zebrabyte-v3.json')
          dst = Path('public/lottie/trust-center/slack-zebrabyte-v4.json')
          page = Path('src/pages/products/compliance-portal.astro')
          data = json.loads(src.read_text())

          # Build one compact wordmark that occupies the exact old Probo footprint.
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf', 14)
          text = 'ZEBRABYTE'
          bb = font.getbbox(text)
          tight = Image.new('RGBA', (bb[2]-bb[0]+2, bb[3]-bb[1]+2), (0,0,0,0))
          ImageDraw.Draw(tight).text((1-bb[0],1-bb[1]), text, font=font, fill=(0,0,0,255))
          tight = tight.resize((59,12), Image.Resampling.LANCZOS)
          word = Image.new('RGBA',(61,17),(0,0,0,0))
          word.alpha_composite(tight,(1,2))
          bio=BytesIO(); word.save(bio,format='PNG')
          word_b64=base64.b64encode(bio.getvalue()).decode('ascii')
          word_id='zebrabyte-wordmark-final-v4'

          old_overlay_ids={'zebrabyte-wordmark-compact','zebrabyte-slack-brand-local','zebrabyte-wordmark-v4',word_id}
          data['assets']=[a for a in data.get('assets',[]) if a.get('id') not in old_overlay_ids]
          for asset in data.get('assets',[]):
              if not isinstance(asset,dict) or not isinstance(asset.get('layers'),list):
                  continue
              asset['layers']=[l for l in asset['layers'] if not (isinstance(l,dict) and l.get('refId') in old_overlay_ids)]
          data['assets'].append({'id':word_id,'w':61,'h':17,'u':'','p':'data:image/png;base64,'+word_b64,'e':1})
          assets={str(a.get('id')):a for a in data['assets']}

          # Exact vector glyphs that draw P-r-o-b-o in each animation state.
          probo_shapes={
              '305':[304,302,300,298,296],
              '861':[808,810,812,814,816],
              '2444':[2443,2441,2439,2437,2435],
              '2957':[2956,2954,2952,2950,2948],
          }
          for aid,inds in probo_shapes.items():
              by={l.get('ind'):l for l in assets[aid]['layers']}
              for ind in inds:
                  by[ind].setdefault('ks',{})['o']={'a':0,'k':0}

          # Keep the current correct ZebraByte icon, only make it a touch smaller.
          icon_layers={'355':353,'861':859,'2494':2492,'3004':3002}
          for aid,ind in icon_layers.items():
              layer=next(l for l in assets[aid]['layers'] if l.get('ind')==ind)
              layer.setdefault('ks',{})['s']={'a':0,'k':[72,72,100]}

          # Add the clean single-line wordmark as a sibling of the old vector word.
          targets={
              '305': {'parent':276,'ind':20305},
              '861': {'parent':788,'ind':20861},
              '2444':{'parent':2415,'ind':22444},
              '2957':{'parent':2928,'ind':22957},
          }
          for aid,cfg in targets.items():
              assets[aid]['layers'].insert(0,{
                  'ddd':0,'ind':cfg['ind'],'ty':2,'nm':'ZEBRABYTE','refId':word_id,
                  'parent':cfg['parent'],'w':61,'h':17,
                  'ks':{
                      'o':{'a':0,'k':100},'r':{'a':0,'k':0},
                      'p':{'a':0,'k':[0.5,7.2]},'a':{'a':0,'k':[0,0]},
                      's':{'a':0,'k':[100,100,100]},
                  },
                  'ao':0,'ip':0,'op':1291.6,'st':0,'bm':0,
              })

          dst.write_text(json.dumps(data,separators=(',',':')))
          txt=page.read_text()
          for old in ['/lottie/trust-center/slack.json','/lottie/trust-center/slack-zebrabyte-v2.json','/lottie/trust-center/slack-zebrabyte-v3.json']:
              txt=txt.replace(old,'/lottie/trust-center/slack-zebrabyte-v4.json')
          page.write_text(txt)

          # Hard assertions against the exact regression shown in staging.
          check=json.loads(dst.read_text()); ca={str(a.get('id')):a for a in check['assets']}
          raw=dst.read_text()
          assert 'zebrabyte-wordmark-compact' not in raw
          assert 'zebrabyte-slack-brand-local' not in raw
          for aid,inds in probo_shapes.items():
              by={l.get('ind'):l for l in ca[aid]['layers']}
              assert all(by[i]['ks']['o']['k']==0 for i in inds)
              assert any(l.get('refId')==word_id for l in ca[aid]['layers'])
          assert '/lottie/trust-center/slack-zebrabyte-v4.json' in page.read_text()
          print('Slack v4 branding QA PASS')
          PY
      - name: Commit fix and clean temporary QA
        shell: bash
        run: |
          rm -rf .tmp-slack-qa
          git rm -f .github/workflows/temporary-final-slack-brand-v4.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remove vector Probo overlap from Slack animation'
          git push origin HEAD:main
