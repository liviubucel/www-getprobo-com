name: Visual polish cleanup
on:
  push:
    branches: [fix/probo-visual-polish]
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/probo-visual-polish
          fetch-depth: 0
      - name: Restore generated files to staging baseline
        run: |
          git fetch origin feat/legal-center-audit
          git checkout origin/feat/legal-center-audit -- \
            public/logos/compliance/cyber-essentials-plus.webp \
            public/logos/compliance/iso-22301.svg \
            public/logos/compliance/iso-27001.svg \
            public/logos/compliance/iso-9001.svg \
            public/logos/compliance/soc2-type2.webp \
            public/logos/partners/20i.svg \
            public/logos/partners/xcitium.svg \
            worker/blog-legacy-redirects.ts \
            worker/blog-zebrabyte-slugs.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Revalidate visual contract
        run: npm run check:experience
      - name: Commit cleanup
        run: |
          rm .github/workflows/visual-polish-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/logos worker/blog-legacy-redirects.ts worker/blog-zebrabyte-slugs.ts .github/workflows/visual-polish-cleanup.yml
          git commit -s -m "Keep visual polish scoped to presentation"
          git push origin HEAD:fix/probo-visual-polish
