name: Release public brand audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'release/production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Report exact public legacy-brand matches
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const root = 'dist';
          const pattern = /(?:\bprobo\b|\bgetprobo\b|probo[-_.\/]|(?:[a-z0-9-]+\.)?probo\.com|probostatus\.com)/ig;
          const files = [];
          const walk = d => { for (const e of readdirSync(d)) { const p=join(d,e); const s=statSync(p); s.isDirectory()?walk(p):/\.(html|md|txt|xml)$/i.test(e)&&files.push(p); } };
          walk(root);
          let count = 0;
          for (const file of files) {
            let text = readFileSync(file,'utf8');
            if (file.endsWith('.html')) text = text.replace(/<(script|style|textarea)\b[^>]*>[\s\S]*?<\/\1>/gi,'');
            pattern.lastIndex = 0;
            let m;
            while ((m = pattern.exec(text)) && count < 200) {
              const start=Math.max(0,m.index-100), end=Math.min(text.length,m.index+m[0].length+140);
              console.log(`${relative(root,file)} :: ${text.slice(start,end).replace(/\s+/g,' ')}`);
              count++;
            }
          }
          console.log(`legacy_public_match_count=${count}`);
          if (count) process.exitCode = 1;
          NODE
