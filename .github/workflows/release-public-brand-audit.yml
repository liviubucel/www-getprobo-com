name: Release public brand audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'release/production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build through preservation and public-brand gates
        run: npm run build
