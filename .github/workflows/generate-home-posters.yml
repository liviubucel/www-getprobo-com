name: Generate optimized homepage video posters

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/generate-home-posters.yml

permissions:
  contents: write

jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate posters from final ZebraByte MP4s
        run: |
          ffmpeg -loglevel error -y -ss 1.0 -i public/videos/keyshot1.mp4 -frames:v 1 -q:v 3 public/videos/keyshot1.jpg
          ffmpeg -loglevel error -y -ss 1.0 -i public/videos/keyshot2.mp4 -frames:v 1 -q:v 3 public/videos/keyshot2.jpg
          ffmpeg -loglevel error -y -ss 2.0 -i public/videos/keyshot3.mp4 -frames:v 1 -q:v 3 public/videos/keyshot3.jpg
          ffmpeg -loglevel error -y -ss 1.0 -i public/videos/keyshot4.mp4 -frames:v 1 -q:v 3 public/videos/keyshot4.jpg
          ls -lh public/videos/keyshot*.jpg
      - name: Commit optimized posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/keyshot1.jpg public/videos/keyshot2.jpg public/videos/keyshot3.jpg public/videos/keyshot4.jpg
          git commit -m "perf: add optimized posters for homepage videos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
