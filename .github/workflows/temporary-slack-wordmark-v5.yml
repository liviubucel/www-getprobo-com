name: Temporary Slack wordmark v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-slack-wordmark-v5.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enlarge ZebraByte wordmark and publish v5
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('public/lottie/trust-center/slack-zebrabyte-v4.json')
          dst = Path('public/lottie/trust-center/slack-zebrabyte-v5.json')
          page = Path('src/pages/products/compliance-portal.astro')

          data = json.loads(src.read_text())
          assets = {str(a.get('id')): a for a in data.get('assets', [])}
          targets = {
              '305': 20305,
              '861': 20861,
              '2444': 22444,
              '2957': 22957,
          }

          for aid, ind in targets.items():
              layer = next((l for l in assets[aid]['layers'] if l.get('ind') == ind and l.get('nm') == 'ZEBRABYTE'), None)
              if layer is None:
                  raise SystemExit(f'ZEBRABYTE layer missing: {aid}/{ind}')
              layer.setdefault('ks', {})['s'] = {'a': 0, 'k': [128, 128, 100]}

          dst.write_text(json.dumps(data, separators=(',', ':')))

          text = page.read_text()
          for old in [
              '/lottie/trust-center/slack-zebrabyte-v4.json',
              '/lottie/trust-center/slack-zebrabyte-v5.json',
          ]:
              text = text.replace(old, '/lottie/trust-center/slack-zebrabyte-v5.json')
          page.write_text(text)

          check = json.loads(dst.read_text())
          ca = {str(a.get('id')): a for a in check.get('assets', [])}
          for aid, ind in targets.items():
              layer = next(l for l in ca[aid]['layers'] if l.get('ind') == ind)
              assert layer['ks']['s']['k'] == [128, 128, 100]
          assert '/lottie/trust-center/slack-zebrabyte-v5.json' in page.read_text()
          print('Slack ZEBRABYTE v5 enlarged to 128% in all four states')
          PY

      - name: Commit and self-remove workflow
        shell: bash
        run: |
          git rm .github/workflows/temporary-slack-wordmark-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lottie/trust-center/slack-zebrabyte-v5.json src/pages/products/compliance-portal.astro
          git diff --cached --quiet && { echo 'No change'; exit 1; }
          git commit -m 'fix: make ZebraByte Slack wordmark visibly larger'
          git push origin HEAD:main
