name: Inspect homepage videos

on:
  push:
    branches:
      - feat/home-zebrabyte-motion
    paths:
      - .github/workflows/home-video-inspect.yml

permissions:
  contents: read

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify media tools
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Build contact sheets
        run: |
          mkdir -p video-inspect
          for file in public/videos/keyshot1.mp4 public/videos/keyshot2.mp4 public/videos/keyshot3.mp4 public/videos/keyshot4.mp4; do
            name="$(basename "$file" .mp4)"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$file" > "video-inspect/${name}-duration.txt"
            ffmpeg -y -i "$file" -vf "fps=2,scale=560:360:force_original_aspect_ratio=decrease:force_divisible_by=2,tile=4x3:padding=4:margin=4" -frames:v 1 "video-inspect/${name}-sheet.jpg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-video-contact-sheets
          path: video-inspect/
          retention-days: 3
