name: Temporary finalize Worker redirects

on:
  push:
    branches: [safe/worker-redirects-no-design]
    paths:
      - .github/workflows/temporary-worker-redirects-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/worker-redirects-no-design
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch Worker router and build contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          router_path = Path('worker/router.ts')
          router = router_path.read_text()
          import_line = 'import { resolveRedirect } from "../src/lib/redirects.mjs";\n'
          if import_line not in router:
              router = router.replace('import app from "./index";\n', 'import app from "./index";\n' + import_line, 1)

          router = re.sub(
              r'function legacyFrenchRedirect\(request: Request\): Response \| null \{.*?\n\}\n\n(?=function legacyWixBlogRedirect)',
              '',
              router,
              flags=re.S,
          )

          configured = r'''function configuredRedirect(request: Request): Response | null {
            if (request.method !== "GET" && request.method !== "HEAD") return null;

            const url = new URL(request.url);
            const english = isEnglishPath(url.pathname);
            const lookupPath = english ? stripEnglishPrefix(url.pathname) : url.pathname;
            const rule = resolveRedirect(lookupPath);
            if (!rule) return null;

            const target = new URL(rule.destination, url.origin);
            if (english && target.origin === url.origin) {
              target.pathname = toEnglishPath(target.pathname);
            }
            if (!target.search && url.search) target.search = url.search;

            return new Response(null, {
              status: rule.status,
              headers: {
                Location: target.toString(),
                "Cache-Control": "public, max-age=3600, s-maxage=86400",
              },
            });
          }

          '''
          if 'function configuredRedirect(request: Request)' not in router:
              router = router.replace('function legacyWixBlogRedirect(request: Request): Response | null {', configured + 'function legacyWixBlogRedirect(request: Request): Response | null {', 1)

          old = '''    const frenchRedirect = legacyFrenchRedirect(request);
            if (frenchRedirect) return frenchRedirect;

            const wixBlogRedirect = legacyWixBlogRedirect(request);'''
          if old in router:
              router = router.replace(old, '''    const publicRedirect = configuredRedirect(request);
            if (publicRedirect) return publicRedirect;

            const wixBlogRedirect = legacyWixBlogRedirect(request);''', 1)
          else:
              router = router.replace('    const wixBlogRedirect = legacyWixBlogRedirect(request);', '    const publicRedirect = configuredRedirect(request);\n    if (publicRedirect) return publicRedirect;\n\n    const wixBlogRedirect = legacyWixBlogRedirect(request);', 1)

          if 'legacyFrenchRedirect(' in router:
              raise SystemExit('legacyFrenchRedirect remained after patch')
          if 'configuredRedirect(request)' not in router:
              raise SystemExit('configured redirect call missing')
          router_path.write_text(router)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['check:redirects'] = 'node tools/check-redirects.mjs'
          build = package['scripts']['build']
          if 'npm run redirects:generate' not in build:
              build = build.replace('&& astro build', '&& npm run redirects:generate && npm run check:redirects && astro build')
          package['scripts']['build'] = build
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Generate and validate redirects
        run: |
          npm ci --progress=false
          npm run redirects:generate
          npm run check:redirects
          grep -Fx '/products/compliance-portal /compliance-portal 301' public/_redirects
          grep -Fx '/compliance-guides/soc2 /soc2 301' public/_redirects
          grep -Fx '/compliance-guides/iso27001 /iso-27001 301' public/_redirects

      - name: Protect visual design
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git diff --quiet origin/main -- src/pages/compliance-portal.astro src/pages/products/compliance-portal.astro src/styles src/components/LottiePlayer.svelte; then
            echo '::error::Protected design files changed.'
            git diff origin/main -- src/pages/compliance-portal.astro src/pages/products/compliance-portal.astro src/styles src/components/LottiePlayer.svelte
            exit 1
          fi

      - name: Full release validation
        run: |
          npm run build
          npx wrangler deploy --dry-run

      - name: Commit validated redirect fix
        shell: bash
        run: |
          git rm .github/workflows/temporary-worker-redirects-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/redirects.mjs tools/generate-redirects.mjs tools/check-redirects.mjs worker/router.ts package.json public/_redirects
          git commit -m 'fix: enforce canonical redirects in Worker routing'
          git push origin HEAD:safe/worker-redirects-no-design
