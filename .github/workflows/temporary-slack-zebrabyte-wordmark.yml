name: Temporary Slack ZebraByte wordmark tweak

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-slack-zebrabyte-wordmark.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Shrink icon and replace Probo wordmark with ZEBRABYTE
        shell: bash
        run: |
          python - <<'PY'
          import base64, json
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          path = Path('public/lottie/trust-center/slack.json')
          data = json.loads(path.read_text())
          assets = {str(a.get('id')): a for a in data.get('assets', [])}

          word_id = 'zebrabyte-wordmark-compact'
          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 12)
          text = 'ZEBRABYTE'
          left, top, right, bottom = font.getbbox(text)
          pad_x, pad_y = 2, 2
          img = Image.new('RGBA', (right - left + pad_x * 2, bottom - top + pad_y * 2), (255, 255, 255, 0))
          draw = ImageDraw.Draw(img)
          draw.text((pad_x - left, pad_y - top), text, font=font, fill=(0, 0, 0, 255))
          bio = BytesIO()
          img.save(bio, format='PNG')
          word_b64 = base64.b64encode(bio.getvalue()).decode('ascii')

          data['assets'] = [a for a in data.get('assets', []) if a.get('id') != word_id]
          data['assets'].append({'id': word_id, 'w': img.width, 'h': img.height, 'u': '', 'p': 'data:image/png;base64,' + word_b64, 'e': 1})
          assets = {str(a.get('id')): a for a in data.get('assets', [])}

          for aid, ind in {'355':353, '861':859, '2494':2492, '3004':3002}.items():
              layer = next(l for l in assets[aid]['layers'] if l.get('ind') == ind)
              ks = layer.setdefault('ks', {})
              ks['s'] = {'a':0,'k':[84,84,100]}

          for aid, ind in {'305':292, '861':804, '2444':2431, '2957':2944}.items():
              layer = next(l for l in assets[aid]['layers'] if l.get('ind') == ind)
              layer['ty'] = 2
              layer['refId'] = word_id
              layer['w'] = img.width
              layer['h'] = img.height
              ks = layer.setdefault('ks', {})
              ks['a'] = {'a':0,'k':[0,0,0]}
              ks['s'] = {'a':0,'k':[100,100,100]}
              ks['o'] = {'a':0,'k':100}

          path.write_text(json.dumps(data, separators=(',', ':')))
          check = json.loads(path.read_text())
          ca = {str(a.get('id')): a for a in check['assets']}
          assert word_id in ca
          for aid, ind in {'355':353, '861':859, '2494':2492, '3004':3002}.items():
              layer = next(l for l in ca[aid]['layers'] if l.get('ind') == ind)
              assert layer['ks']['s']['k'] == [84,84,100]
          for aid, ind in {'305':292, '861':804, '2444':2431, '2957':2944}.items():
              layer = next(l for l in ca[aid]['layers'] if l.get('ind') == ind)
              assert layer.get('refId') == word_id
          print('verified wordmark and logo size update')
          PY
      - name: Commit patched Lottie
        shell: bash
        run: |
          if git diff --quiet -- public/lottie/trust-center/slack.json; then
            echo 'No change'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lottie/trust-center/slack.json
          git commit -m 'fix: reduce Slack icon and replace Probo with ZEBRABYTE'
          git push origin HEAD:main
