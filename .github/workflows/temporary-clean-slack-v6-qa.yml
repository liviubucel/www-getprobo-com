name: Temporary clean Slack v6 QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-clean-slack-v6-qa.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove QA artifacts
        shell: bash
        run: |
          git rm -rf .tmp-slack-v6-qa 2>/dev/null || true
          git rm -rf .tmp-slack-v6-brand 2>/dev/null || true
          git rm .github/workflows/temporary-clean-slack-v6-qa.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove Slack v6 QA artifacts'
          git push origin HEAD:main
