name: Temporary finalize Slack v6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-finalize-slack-v6.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Activate v6 and verify structure
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          page = Path('src/pages/products/compliance-portal.astro')
          txt = page.read_text()
          txt = txt.replace('/lottie/trust-center/slack-zebrabyte-v5.json', '/lottie/trust-center/slack-zebrabyte-v6.json')
          page.write_text(txt)

          lottie = Path('public/lottie/trust-center/slack-zebrabyte-v6.json')
          data = json.loads(lottie.read_text())
          assets = {str(a.get('id')): a for a in data.get('assets', [])}
          targets = {'305':20305,'861':20861,'2444':22444,'2957':22957}
          for aid, ind in targets.items():
              layer = next(l for l in assets[aid]['layers'] if l.get('ind') == ind)
              assert layer.get('ty') == 5
              s = layer['t']['d']['k'][0]['s']
              assert s['t'] == 'ZEBRABYTE'
              assert s['f'] == 'GeistSemiBold'
              assert s['s'] == 14.2
          assert any(f.get('fName') == 'GeistSemiBold' and f.get('fFamily') == 'Geist' for f in data.get('fonts',{}).get('list',[]))
          assert '/lottie/trust-center/slack-zebrabyte-v6.json' in page.read_text()
          print('Slack v6 structural QA PASS')
          PY
      - name: Clean temporary QA files
        shell: bash
        run: |
          rm -rf .tmp-slack-v6-qa .tmp-slack-v6-brand
          rm -f .github/workflows/temporary-slack-v6-brand-crop.yml
      - name: Install dependencies
        run: npm ci --progress=false
      - name: Experience checks
        run: npm run check:experience
      - name: Production build
        run: npm run build
      - name: Commit optimized Slack v6
        shell: bash
        run: |
          git rm .github/workflows/temporary-finalize-slack-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/products/compliance-portal.astro
          git add -u .tmp-slack-v6-qa .tmp-slack-v6-brand .github/workflows/temporary-slack-v6-brand-crop.yml 2>/dev/null || true
          git add public/lottie/trust-center/slack-zebrabyte-v6.json
          git commit -m 'fix: refine Slack ZebraByte branding with native Geist wordmark'
          git push origin HEAD:main
