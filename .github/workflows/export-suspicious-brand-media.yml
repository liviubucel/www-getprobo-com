name: Export suspicious public brand media

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-suspicious-brand-media.yml

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: suspicious-public-brand-media
          path: |
            src/assets/photos/probo-ads.png
            src/assets/hub/cloud-security-best-practices/probo-homepage-screenshot.jpg
            src/assets/hub/cloud-security-best-practices/cta-compliance-done-for-you.png
            src/assets/hub/cloud-security-best-practices/cta-stay-audit-ready.png
            src/assets/trust-center-example.png
          retention-days: 1
