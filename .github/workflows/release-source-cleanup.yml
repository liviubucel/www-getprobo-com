name: Release source cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'release/production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact source corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tools/sync-github-changelog.mjs'): [
                  ('liviubucel/www-getprobo-com', 'liviubucel/zebrabyte-website'),
              ],
              Path('src/pages/secure-hosting.astro'): [
                  ('Probo operating model', 'Security-first operating model'),
                  ('Păstrăm vizualurile și modelul continuu Probo și în infrastructură.', 'Păstrăm un model operațional continuu și în infrastructură.'),
                  ('pe care Probo îl folosește pentru compliance', 'folosit pentru programul de compliance'),
              ],
              Path('src/pages/recenzii-video.astro'): [
                  ('Recenzii ZebraByte și formular securizat pentru feedback, păstrate din website-ul anterior și integrate în experiența Probo.', 'Recenzii ZebraByte și formular securizat pentru feedback, integrate în experiența publică ZebraByte.'),
                  ('Păstrăm recenziile reale ZebraByte și formularul prin care clienții pot trimite feedback. Wall-ul și testimonialele originale Probo rămân separat, integral.', 'Publicăm doar recenzii atribuite ZebraByte și păstrăm formularul prin care clienții pot trimite feedback pentru verificare.'),
                  ('Homepage-ul și pagina Love from Customers includ feedback ZebraByte din sursele păstrate în website-ul anterior, iar dedesubt păstrăm și sliderul complet de testimoniale Probo cu fotografiile și citatele originale.', 'Homepage-ul și pagina Love from Customers includ feedback atribuit ZebraByte din sursele păstrate în website-ul anterior. Nu amestecăm acest feedback cu testimonialele sau relațiile comerciale ale platformei upstream.'),
                  ('ZebraByte reviews + customer wall și testimoniale Probo.', 'Recenzii și feedback atribuite ZebraByte.'),
                  ('Studii de caz ZebraByte + biblioteca Probo păstrată.', 'Studii de caz și referințe publicate explicit pentru ZebraByte.'),
              ],
          }

          changed = []
          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in items:
                  if old not in text:
                      raise SystemExit(f'Expected source text not found in {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Validate exact changed files
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -qx 'src/pages/recenzii-video.astro'
          printf '%s\n' "$changed" | grep -qx 'src/pages/secure-hosting.astro'
          printf '%s\n' "$changed" | grep -qx 'tools/sync-github-changelog.mjs'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Commit validated source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/recenzii-video.astro src/pages/secure-hosting.astro tools/sync-github-changelog.mjs
          git commit -m 'fix: remove remaining upstream public copy and stale repo slug'
          git push origin HEAD:release/production-readiness
