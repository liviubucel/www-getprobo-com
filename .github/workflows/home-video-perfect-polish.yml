name: Perfect polish homepage MP4 branding

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/home-video-perfect-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Restore pristine original MP4s
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- public/videos/keyshot1.mp4 public/videos/keyshot2.mp4 public/videos/keyshot3.mp4 public/videos/keyshot4.mp4

      - name: Restore ZebraByte mark mask
        run: |
          git fetch origin 698b5134bfff5eee90016f11d35b7506d75f410a --depth=1
          git show 698b5134bfff5eee90016f11d35b7506d75f410a:tools/home-video-mark-alpha.b64 > /tmp/home-video-mark-alpha.b64

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-inter
          python3 -m pip install --break-system-packages --disable-pip-version-check opencv-python-headless==4.10.0.84 pillow

      - name: Apply frame-accurate ZebraByte compositing
        run: python3 tools/rebrand-home-videos-final.py

      - name: Validate geometry and create dense proof
        run: |
          rm -rf /tmp/video-proof
          mkdir -p /tmp/video-proof
          for file in public/videos/keyshot1.mp4 public/videos/keyshot2.mp4 public/videos/keyshot3.mp4 public/videos/keyshot4.mp4; do
            name="$(basename "$file" .mp4)"
            ffprobe -v error -show_entries stream=width,height,nb_frames,r_frame_rate -show_entries format=duration,size -of default=nw=1 "$file" > "/tmp/video-proof/${name}-meta.txt"
            ffmpeg -loglevel error -y -i "$file" -vf "fps=4,scale=250:180:force_original_aspect_ratio=decrease,tile=10x12:padding=1:margin=1" -frames:v 1 "/tmp/video-proof/${name}-dense.jpg" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: homepage-video-final-proof
          path: /tmp/video-proof
          retention-days: 3

      - name: Commit only final MP4s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/keyshot1.mp4 public/videos/keyshot2.mp4 public/videos/keyshot3.mp4 public/videos/keyshot4.mp4
          git diff --cached --quiet && exit 1
          git commit -m "feat: polish ZebraByte branding through homepage video transitions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
