name: Visual polish bootstrap

on:
  push:
    branches:
      - fix/probo-visual-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout polish branch
        uses: actions/checkout@v4
        with:
          ref: fix/probo-visual-polish
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply visual-system repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected visual contract snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # Fix the invalid XML entity that breaks the Company feature artwork.
          replace(
              "public/og-zebrabyte.svg",
              "<title id=\"title\">ZebraByte — Cyber Security & Compliance</title>",
              "<title id=\"title\">ZebraByte — Cyber Security &amp; Compliance</title>",
          )

          # Restore Probo's exact navigation halo treatment. Keep ZebraByte's
          # menu geometry/content, but use the original optical finish.
          replace(
              "src/components/HeaderMenu.astro",
              '''  .navigation-feature-halo {\n    position: absolute;\n    inset: 18% -20% -38%;\n    display: block;\n    border-radius: 50%;\n    background: radial-gradient(circle at 50% 45%, rgba(147, 201, 38, 0.2), transparent 62%);\n    pointer-events: none;\n  }''',
              '''  .navigation-feature-halo {\n    position: absolute;\n    bottom: -52px;\n    left: 50%;\n    z-index: 2;\n    display: block;\n    width: 783px;\n    height: 783px;\n    transform: translateX(-50%);\n    pointer-events: none;\n  }\n\n  .navigation-feature-halo::before {\n    position: absolute;\n    inset: -21.93%;\n    content: \"\";\n    background: url(\"/navigation/ellipse.svg\") center / 100% 100% no-repeat;\n    transform: rotate(180deg) scaleY(-1);\n  }''',
          )

          # Match Probo's translucent header surface while preserving all
          # ZebraByte navigation/actions and responsive breakpoints.
          replace(
              "src/components/Header.astro",
              '"bg-secondary/90 sticky top-0 z-50 border-b backdrop-blur-md"',
              '"bg-secondary/80 sticky top-0 z-50 border-b backdrop-blur-md"',
          )

          # New ZebraByte-only account UI should use the same Probo shadow
          # language rather than bespoke green/black shadow values.
          replace(
              "src/components/AccountMenu.astro",
              '"text-primary grid size-10 place-items-center transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",',
              '"text-primary grid place-items-center transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",',
          )
          replace(
              "src/components/AccountMenu.astro",
              '? "text-muted-foreground hover:text-primary rounded-lg hover:bg-subtle aria-expanded:bg-subtle aria-expanded:text-primary aria-expanded:ring-1 aria-expanded:ring-current/10"\n        : "bg-secondary hover:bg-active rounded-full border shadow-[0_1px_2px_rgba(20,30,18,0.04)] transition-[background-color,border-color,box-shadow] hover:shadow-[0_3px_10px_rgba(20,30,18,0.09)] aria-expanded:bg-subtle aria-expanded:shadow-[0_3px_10px_rgba(20,30,18,0.10)]",',
              '? "text-muted-foreground hover:text-primary size-10 rounded-lg hover:bg-subtle aria-expanded:bg-subtle aria-expanded:text-primary aria-expanded:ring-1 aria-expanded:ring-current/10"\n        : "bg-secondary hover:bg-active shadow-btn size-8 rounded-full border transition-[background-color,border-color,box-shadow] aria-expanded:bg-subtle",',
          )
          replace(
              "src/components/AccountMenu.astro",
              '"bg-secondary overflow-hidden border shadow-[0_16px_32px_rgba(20,30,18,0.16)]",',
              '"bg-secondary overflow-hidden border shadow-[inset_0_0_0_1px_var(--color-border-low),0_16px_32px_rgba(186,193,122,0.2)]",',
          )

          # Language control inherits the same navigation hover/focus treatment
          # as Probo's header controls. Compact mobile sizing stays touch-safe.
          replace(
              "src/components/LanguageSwitcher.astro",
              '"text-muted-foreground hover:text-primary inline-flex h-10 items-center justify-center gap-1.5 rounded-lg px-2 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current/15",\n    compact && "px-1.5",',
              '"text-muted-foreground hover:text-primary hover:bg-highlight inline-flex items-center justify-center gap-1.5 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-current focus-visible:ring-offset-2",\n    compact ? "size-10 rounded-lg px-1.5" : "h-8 rounded-md px-[9px]",',
          )

          replace(
              "package.json",
              '"check:experience": "node tools/check-experience-contract.mjs && node tools/check-experience-provenance.mjs",',
              '"check:experience": "node tools/check-probo-design-contract.mjs && node tools/check-svg-assets.mjs && node tools/check-experience-contract.mjs && node tools/check-experience-provenance.mjs",',
          )
          PY

          cat > tools/check-svg-assets.mjs <<'EOF'
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";

          const roots = ["public", "src/assets"];
          const bareEntity = /&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g;
          const failures = [];

          async function walk(directory) {
            let entries;
            try {
              entries = await readdir(directory, { withFileTypes: true });
            } catch (error) {
              if (error?.code === "ENOENT") return;
              throw error;
            }

            for (const entry of entries) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                await walk(file);
                continue;
              }
              if (!entry.isFile() || !entry.name.toLowerCase().endsWith(".svg")) continue;

              const source = await readFile(file, "utf8");
              const bareMatches = [...source.matchAll(bareEntity)];
              if (bareMatches.length) {
                failures.push(`${file}: unescaped XML entity '&'`);
              }
              if (!/^\s*<svg\b/i.test(source) || !/<\/svg>\s*$/i.test(source)) {
                failures.push(`${file}: missing a valid <svg> root/end tag`);
              }
            }
          }

          for (const root of roots) await walk(root);

          if (failures.length) {
            console.error("SVG asset validation failed:\n" + failures.map((item) => `- ${item}`).join("\n"));
            process.exit(1);
          }

          console.log("SVG assets: XML sanity checks passed.");
          EOF

          cat > tools/check-probo-design-contract.mjs <<'EOF'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const upstreamBlobs = new Map([
            ["src/styles/theme.css", "d514f5f87f0cd7727e007d0f0a51b5c8bd4e2bbb"],
            ["src/styles/global.css", "feb11855739bcc75d0dcb378d38907d3b497c3c8"],
            ["src/components/ui/Button.svelte", "67b134e8decd903993d95ce78275356146028613"],
            ["public/navigation/ellipse.svg", "c5df0e5e37ed217f2d312c632db58196893b8775"],
            ["public/navigation/browser.svg", "ed82881e6a49ecb1a88f57e8669c8bfbecc08f2c"],
          ]);

          function gitBlobSha(buffer) {
            const header = Buffer.from(`blob ${buffer.length}\0`);
            return createHash("sha1").update(header).update(buffer).digest("hex");
          }

          const failures = [];
          for (const [file, expected] of upstreamBlobs) {
            const buffer = await readFile(file);
            const actual = gitBlobSha(buffer);
            if (actual !== expected) failures.push(`${file}: ${actual} != Probo ${expected}`);
          }

          const headerMenu = await readFile("src/components/HeaderMenu.astro", "utf8");
          if (!headerMenu.includes('background: url("/navigation/ellipse.svg") center / 100% 100% no-repeat;')) {
            failures.push("HeaderMenu: original Probo navigation halo asset is not active");
          }
          if (headerMenu.includes("radial-gradient(circle at 50% 45%")) {
            failures.push("HeaderMenu: simplified replacement halo reintroduced");
          }

          if (failures.length) {
            console.error("Probo visual contract failed:\n" + failures.map((item) => `- ${item}`).join("\n"));
            process.exit(1);
          }

          console.log("Probo visual primitives: contract preserved.");
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Validate experience contract
        run: npm run check:experience

      - name: Build website
        run: npm run build

      - name: Commit validated polish
        shell: bash
        run: |
          rm .github/workflows/visual-polish-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-zebrabyte.svg src/components/HeaderMenu.astro src/components/Header.astro src/components/AccountMenu.astro src/components/LanguageSwitcher.astro package.json tools/check-svg-assets.mjs tools/check-probo-design-contract.mjs .github/workflows/visual-polish-bootstrap.yml
          git commit -s -m "Polish ZebraByte visual system against Probo"
          git push origin HEAD:fix/probo-visual-polish
