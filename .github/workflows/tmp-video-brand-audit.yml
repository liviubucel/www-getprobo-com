name: Temporary video brand audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-video-brand-audit.yml

permissions:
  contents: read

jobs:
  audit-video-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/home-zebrabyte-motion

      - name: Install OCR dependency
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Audit remaining MP4 branding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/video-audit
          mkdir -p /tmp/video-audit
          report="/tmp/video-audit/video-brand-audit.txt"
          : > "$report"
          videos=(
            "public/changelog/2026-04-03-markdown-copy-paste.mp4"
            "public/changelog/2026-05-04-cookie.banner.mp4"
          )

          for video in "${videos[@]}"; do
            base="$(basename "$video" .mp4)"
            out="/tmp/video-audit/$base"
            mkdir -p "$out/frames" "$out/ocr"

            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$video")"
            fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$video")"
            size="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
            printf 'VIDEO %s\nDURATION %s\nFPS %s\nSIZE %s\n' "$video" "$duration" "$fps" "$size" >> "$report"

            ffmpeg -hide_banner -loglevel error -i "$video" -vf "fps=4" "$out/frames/frame-%06d.png"

            index=0
            for frame in "$out"/frames/frame-*.png; do
              index=$((index+1))
              tsv="$out/ocr/$(basename "${frame%.png}").tsv"
              tesseract "$frame" stdout --psm 11 tsv 2>/dev/null > "$tsv" || true
              python3 - "$tsv" "$index" >> "$report" <<'PY'
import csv, re, sys
from difflib import SequenceMatcher
path = sys.argv[1]
idx = int(sys.argv[2])
time = (idx - 1) / 4.0

def norm(s):
    s = s.lower().replace('0','o').replace('|','l')
    return re.sub(r'[^a-z]', '', s)

def looks_like_probo(s):
    n = norm(s)
    if not n:
        return False
    if 'probo' in n:
        return True
    return len(n) in range(4,7) and SequenceMatcher(None, n, 'probo').ratio() >= 0.72

with open(path, encoding='utf-8', errors='ignore') as f:
    rows = list(csv.DictReader(f, delimiter='\t'))
for r in rows:
    text = (r.get('text') or '').strip()
    if not looks_like_probo(text):
        continue
    try:
        conf = float(r.get('conf') or -1)
    except ValueError:
        conf = -1
    print('MATCH t={:.2f}s frame={} text={!r} conf={:.1f} box={},{},{},{}'.format(
        time, idx, text, conf, r.get('left'), r.get('top'), r.get('width'), r.get('height')
    ))
PY
            done
            printf 'END_VIDEO\n\n' >> "$report"
          done

          cat "$report"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: remaining-video-brand-audit
          path: /tmp/video-audit/video-brand-audit.txt
          if-no-files-found: error
          retention-days: 1
