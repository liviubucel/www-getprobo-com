name: Temporary render Slack v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-render-slack-v3.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - run: npm install --no-save puppeteer-core@24
      - name: Create preview page
        shell: bash
        run: |
          mkdir -p tmp/slack-render
          cat > tmp/slack-render/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          html,body{margin:0;background:#fff} #anim{width:900px;height:900px}
          </style></head><body>
          <div id="anim"></div>
          <script src="/node_modules/lottie-web/build/player/lottie.min.js"></script>
          <script>
          window.ready = new Promise((resolve,reject)=>{
            const anim=lottie.loadAnimation({container:document.getElementById('anim'),renderer:'svg',loop:false,autoplay:false,path:'/public/lottie/trust-center/slack-zebrabyte-v3.json',rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
            anim.addEventListener('DOMLoaded',()=>{window.anim=anim; resolve(anim.totalFrames)});
            anim.addEventListener('data_failed',reject);
          });
          </script></body></html>
          HTML
      - name: Render frames
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/slack-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "Chrome: $CHROME"
          cat > tmp/slack-render/render.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import { mkdir } from 'node:fs/promises';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:900,height:900,deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/tmp/slack-render/index.html',{waitUntil:'networkidle0'});
          const total=await page.evaluate(()=>window.ready);
          await mkdir('tmp/slack-render/out',{recursive:true});
          const fractions=[0.15,0.30,0.45,0.60,0.75,0.90];
          for (let i=0;i<fractions.length;i++) {
            const frame=Math.floor(total*fractions[i]);
            await page.evaluate((f)=>window.anim.goToAndStop(f,true),frame);
            await new Promise(r=>setTimeout(r,150));
            await page.screenshot({path:`tmp/slack-render/out/frame-${i+1}-${frame}.png`,clip:{x:0,y:0,width:900,height:900}});
          }
          console.log({total});
          await browser.close();
          JS
          CHROME="$CHROME" node tmp/slack-render/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: slack-v3-render
          path: tmp/slack-render/out/*.png
          if-no-files-found: error
