name: Validate website

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require current main baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CURRENT_BASE_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          HEAD_SHA="$(git rev-parse HEAD)"

          echo "Current $BASE_REF: $CURRENT_BASE_SHA"
          echo "PR head: $HEAD_SHA"

          if ! git merge-base --is-ancestor "$CURRENT_BASE_SHA" "$HEAD_SHA"; then
            echo "::error::STALE BASELINE: this PR does not contain the current $BASE_REF. Rebase or recreate the branch from current $BASE_REF before continuing. Do not merge historical branches to repair it."
            exit 1
          fi

          echo "Branch contains the current $BASE_REF baseline."

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build and release gates
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

  temporary-video-brand-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/home-zebrabyte-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install lightweight video OCR dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python3 -m pip install --quiet opencv-python-headless pytesseract

      - name: OCR remaining changelog videos
        run: python3 tmp/video_brand_audit.py

      - name: Upload OCR report and contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: remaining-video-brand-audit
          path: /tmp/video-brand-audit
          retention-days: 1
