name: Validate website

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require current main baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          CURRENT_BASE_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          HEAD_SHA="$(git rev-parse HEAD)"

          echo "Current $BASE_REF: $CURRENT_BASE_SHA"
          echo "PR head: $HEAD_SHA"

          if ! git merge-base --is-ancestor "$CURRENT_BASE_SHA" "$HEAD_SHA"; then
            echo "::error::STALE BASELINE: this PR does not contain the current $BASE_REF. Rebase or recreate the branch from current $BASE_REF before continuing. Do not merge historical branches to repair it."
            exit 1
          fi

          echo "Branch contains the current $BASE_REF baseline."

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build and release gates
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

  temporary-video-brand-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/home-zebrabyte-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install OCR dependency
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: OCR remaining changelog videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/video-brand-audit
          report="/tmp/video-brand-audit/report.txt"
          : > "$report"
          videos=(
            "public/changelog/2026-04-03-markdown-copy-paste.mp4"
            "public/changelog/2026-05-04-cookie.banner.mp4"
          )

          for video in "${videos[@]}"; do
            base="$(basename "$video" .mp4)"
            dir="/tmp/video-brand-audit/$base"
            mkdir -p "$dir/frames"
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$video")"
            fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of default=nw=1:nk=1 "$video")"
            size="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")"
            printf 'VIDEO %s\nDURATION %s\nFPS %s\nSIZE %s\n' "$video" "$duration" "$fps" "$size" >> "$report"

            ffmpeg -hide_banner -loglevel error -i "$video" -vf fps=4 "$dir/frames/frame-%06d.png"
            index=0
            for frame in "$dir"/frames/frame-*.png; do
              index=$((index+1))
              tsv="${frame%.png}.tsv"
              tesseract "$frame" stdout --psm 11 tsv 2>/dev/null > "$tsv" || true
              awk -F '\t' -v idx="$index" 'BEGIN { OFS=" " } NR > 1 { token=tolower($12); gsub(/[^a-z0-9]/,"",token); if (token ~ /pr[o0]b[o0]/) printf "MATCH frame=%d t=%.2fs text=%s conf=%s box=%s,%s,%s,%s\n", idx, (idx-1)/4, $12, $11, $7, $8, $9, $10 }' "$tsv" >> "$report"
            done
            printf 'END_VIDEO\n\n' >> "$report"
          done
          cat "$report"

      - name: Upload OCR report
        uses: actions/upload-artifact@v4
        with:
          name: remaining-video-brand-audit
          path: /tmp/video-brand-audit/report.txt
          retention-days: 1
