name: Restore Probo docs polish
on:
  push:
    branches: [fix/probo-visual-polish]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/probo-visual-polish
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: getprobo/probo.com
          ref: v2
          path: .upstream
      - name: Patch docs styles
        run: |
          python - <<'PY'
          from pathlib import Path
          zf=Path('src/styles/starlight.css'); pf=Path('.upstream/src/styles/starlight.css')
          z=zf.read_text(); p=pf.read_text()
          ps=p.index('  .expressive-code {'); pe=p.index('  details {',ps)
          zs=z.index('  .sl-markdown-content table:not(.not-content *) {'); ze=z.index('  details {',zs)
          zf.write_text(z[:zs]+p[ps:pe]+z[ze:])
          cf=Path('tools/check-probo-design-contract.mjs'); c=cf.read_text()
          if 'Docs: Probo expressive-code treatment missing' not in c:
            needle="if(failures.length){console.error('Probo visual contract failed:"
            add="const docs=await readFile('src/styles/starlight.css','utf8');if(!docs.includes('--ec-frm-frameBoxShdCssVal:'))failures.push('Docs: Probo expressive-code treatment missing');if(!docs.includes('counter-reset: probo-step;'))failures.push('Docs: Probo step treatment missing');if(!docs.includes('border-collapse: separate;'))failures.push('Docs: Probo table treatment missing');if(!docs.includes('padding: 0.1rem 0 0.1rem 1rem;'))failures.push('Docs: Probo aside treatment missing');"
            cf.write_text(c.replace(needle,add+needle,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:experience
      - run: npm run build
      - name: Commit
        run: |
          rm -rf .upstream
          rm -f .github/workflows/visual-audit-report.yml .github/workflows/visual-polish-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/starlight.css tools/check-probo-design-contract.mjs .github/workflows/visual-audit-report.yml .github/workflows/visual-polish-docs.yml
          git commit -s -m "Restore Probo docs presentation polish"
          git push origin HEAD:fix/probo-visual-polish
