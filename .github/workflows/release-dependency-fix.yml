name: Release dependency fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'release/production-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply controlled dependency updates
        run: |
          npm pkg set name=zebrabyte-website
          npm install --save-dev 'wrangler@^4.123.0' --package-lock-only
          npm update nanoid --package-lock-only
      - name: Install exact resolved tree
        run: npm ci
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify complete audit
        run: npm audit --audit-level=high
      - name: Verify production build
        run: npm run build
      - name: Stage only dependency metadata
        run: |
          git add package.json package-lock.json
          echo 'Staged files:'
          git diff --cached --name-only
          unexpected="$(git diff --cached --name-only | grep -vE '^(package.json|package-lock.json)$' || true)"
          test -z "$unexpected"
      - name: Commit resolved dependency tree
        run: |
          if git diff --cached --quiet; then
            echo 'Dependency metadata already resolved; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remediate production dependency advisories'
          git push origin HEAD:release/production-readiness
