name: Temporary optimize Slack ZebraByte v6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-optimize-slack-v6.yml

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --progress=false
          npm install --no-save puppeteer-core@24
      - name: Build optimized v6 Lottie
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path('public/lottie/trust-center/slack-zebrabyte-v5.json')
          dst = Path('public/lottie/trust-center/slack-zebrabyte-v6.json')
          data = json.loads(src.read_text())

          font_name = 'GeistSemiBold'
          fonts = data.setdefault('fonts', {}).setdefault('list', [])
          fonts[:] = [f for f in fonts if f.get('fName') != font_name]
          fonts.append({
              'fName': font_name,
              'fFamily': 'Geist',
              'fStyle': 'SemiBold',
              'ascent': 75,
          })

          assets = {str(a.get('id')): a for a in data.get('assets', [])}
          targets = {
              '305': 20305,
              '861': 20861,
              '2444': 22444,
              '2957': 22957,
          }

          for aid, ind in targets.items():
              layer = next((l for l in assets[aid]['layers'] if l.get('ind') == ind and l.get('nm') == 'ZEBRABYTE'), None)
              if layer is None:
                  raise SystemExit(f'ZEBRABYTE layer missing: {aid}/{ind}')

              layer['ty'] = 5
              layer.pop('refId', None)
              layer.pop('w', None)
              layer.pop('h', None)
              layer['ks'] = {
                  'o': {'a': 0, 'k': 100},
                  'r': {'a': 0, 'k': 0},
                  'p': {'a': 0, 'k': [0.5, 11.2]},
                  'a': {'a': 0, 'k': [0, 0, 0]},
                  's': {'a': 0, 'k': [100, 100, 100]},
              }
              layer['t'] = {
                  'd': {
                      'k': [{
                          's': {
                              'sz': [92, 22],
                              'ps': [0, 0],
                              's': 14.2,
                              'f': font_name,
                              't': 'ZEBRABYTE',
                              'j': 0,
                              'tr': -8,
                              'lh': 16.6,
                              'ls': 0,
                              'fc': [0.0784, 0.1176, 0.0706],
                          },
                          't': 0,
                      }]
                  },
                  'p': {},
                  'm': {'g': 1, 'a': {'a': 0, 'k': [0, 0]}},
                  'a': [],
              }

          # Remove the old raster wordmark asset when no layer references it anymore.
          referenced = {
              l.get('refId')
              for a in data.get('assets', []) if isinstance(a, dict)
              for l in (a.get('layers') or []) if isinstance(l, dict) and l.get('refId')
          }
          data['assets'] = [
              a for a in data.get('assets', [])
              if a.get('id') != 'zebrabyte-wordmark-final-v4' or a.get('id') in referenced
          ]

          dst.write_text(json.dumps(data, separators=(',', ':')))

          check = json.loads(dst.read_text())
          ca = {str(a.get('id')): a for a in check.get('assets', [])}
          for aid, ind in targets.items():
              layer = next(l for l in ca[aid]['layers'] if l.get('ind') == ind)
              assert layer['ty'] == 5
              assert layer['t']['d']['k'][0]['s']['t'] == 'ZEBRABYTE'
              assert layer['t']['d']['k'][0]['s']['f'] == font_name
              assert layer['ks']['s']['k'] == [100, 100, 100]
          print('v6 native Geist wordmark prepared')
          PY
      - name: Render visual QA frames
        shell: bash
        run: |
          mkdir -p .tmp-slack-v6-qa
          cat > .tmp-slack-v6-qa/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
            <style>html,body{margin:0;background:#fff}#anim{width:900px;height:900px}</style>
          </head>
          <body>
            <div id="anim"></div>
            <script src="/node_modules/lottie-web/build/player/lottie.min.js"></script>
            <script>
              window.ready = new Promise((resolve,reject) => {
                const anim = lottie.loadAnimation({
                  container: document.getElementById('anim'),
                  renderer: 'svg',
                  loop: false,
                  autoplay: false,
                  path: '/public/lottie/trust-center/slack-zebrabyte-v6.json',
                  rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
                });
                anim.addEventListener('DOMLoaded', async () => {
                  if (document.fonts && document.fonts.ready) await document.fonts.ready;
                  window.anim = anim;
                  resolve(anim.totalFrames);
                });
                anim.addEventListener('data_failed', reject);
              });
            </script>
          </body>
          </html>
          HTML

          python3 -m http.server 4173 >/tmp/slack-v6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          cat > .tmp-slack-v6-qa/render.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({
            headless: true,
            executablePath: process.env.CHROME,
            args: ['--no-sandbox','--disable-setuid-sandbox'],
          });
          const page = await browser.newPage();
          await page.setViewport({ width: 900, height: 900, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:4173/.tmp-slack-v6-qa/index.html', { waitUntil: 'networkidle0' });
          const total = await page.evaluate(() => window.ready);
          const frames = [193, 387, 580, 774, 967, 1161].filter((f) => f < total);
          for (const frame of frames) {
            await page.evaluate((f) => window.anim.goToAndStop(f, true), frame);
            await new Promise((r) => setTimeout(r, 180));
            await page.screenshot({
              path: `.tmp-slack-v6-qa/frame-${frame}.png`,
              clip: { x: 0, y: 0, width: 900, height: 900 },
            });
          }
          await browser.close();
          JS
          CHROME="$CHROME" node .tmp-slack-v6-qa/render.mjs
          rm -f .tmp-slack-v6-qa/index.html .tmp-slack-v6-qa/render.mjs
      - name: Commit v6 and QA frames
        shell: bash
        run: |
          git rm .github/workflows/temporary-optimize-slack-v6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lottie/trust-center/slack-zebrabyte-v6.json .tmp-slack-v6-qa
          git commit -m 'chore: prepare optimized Slack v6 visual QA'
          git push origin HEAD:main
